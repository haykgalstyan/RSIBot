[project]
name = "rsibot"
version = "0.1.0"
description = "Python bot that pings me if crypto RSI looks interesting. [Learning Python Exercise]"
requires-python = ">=3.12"
dependencies = [
    "ccxt>=4.5.44",
    "pandas>=2.3.3",
    "pandas-ta>=0.4.71b0",
    "aiogram>=3.26.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.13.1",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 80
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.format]
#skip-magic-trailing-comma = false
#quote-style = "double"


